<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project | Jose Osa</title>
  <meta name="description" content="Project detail — Jose Osa engineering portfolio." />
  <meta property="og:title" content="Project | Jose Osa" />
  <meta property="og:description" content="Engineering project by Jose Osa — M.S. Aerospace Engineering, University of Michigan." />
  <meta property="og:image" content="https://joseosa.github.io/Engineering-Portfolio/crescent-moon.png" />
  <meta property="og:url" content="https://joseosa.github.io/Engineering-Portfolio/project.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛸</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-loading">

  <div id="pageOverlay" class="page-overlay"></div>
  <canvas id="stars"></canvas>

  <header class="nav">
    <a href="index.html" class="logo">JOSE OSA</a>
    <nav>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#research">Research</a>
      <a href="index.html#about">About</a>
      <a href="https://www.linkedin.com/in/jose-osa-4b381024b/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="jose-osa-resume.pdf" download class="pill">Resume</a>
      <a href="mailto:joseosa@umich.edu" class="pill">Contact</a>
    </nav>
  </header>

  <main class="project-page">

    <section class="project-hero">
      <img id="projectImage" src="" alt="" />
      <div class="project-hero-overlay"></div>
      <div class="project-hero-content">
        <p id="projectTag" class="eyebrow"></p>
        <h1 id="projectTitle"></h1>
        <p id="projectSummary"></p>
      </div>
    </section>

    <div class="case-grid">
      <article class="case-block">
        <p class="eyebrow">Overview</p>
        <h2 id="overviewTitle"></h2>
        <p id="projectOverview"></p>
      </article>

      <article class="case-block">
        <p class="eyebrow">Challenge</p>
        <h2>Design problem</h2>
        <p id="projectChallenge"></p>
      </article>

      <article class="case-block">
        <p class="eyebrow">Solution</p>
        <h2>Engineering approach</h2>
        <p id="projectSolution"></p>
      </article>
    </div>

    <div class="project-detail-grid">
      <div>
        <p class="eyebrow">Technical Focus</p>
        <h2>Core systems</h2>
        <ul id="projectBullets"></ul>
      </div>
      <div>
        <p class="eyebrow">Impact</p>
        <h2>Why it matters</h2>
        <p id="projectImpact"></p>
      </div>
    </div>

    <div class="visual-showcase">
      <div class="visual-copy">
        <p class="eyebrow">Engineering Visual</p>
        <h2 id="visualTitle"></h2>
        <p id="visualText"></p>
      </div>
      <div id="visualStage" class="visual-stage">
        <img id="diagramImage" class="diagram-image" src="" alt="" />
        <div id="generatedVisual" class="generated-visual"></div>
      </div>
    </div>

    <div id="projectDownload" style="display:none" class="project-download-bar">
      <a id="projectDownloadLink" href="#" download class="btn pill download-btn">⬇ Download Paper (PDF)</a>
    </div>

    <div id="projectGallery" class="project-gallery" style="display:none">
      <div class="gallery-header">
        <p id="galleryEyebrow" class="eyebrow"></p>
        <h2 id="galleryHeading"></h2>
        <p id="galleryIntro" class="gallery-intro"></p>
        <div id="galleryTabs" class="gallery-tabs"></div>
      </div>
      <div class="gallery-stage">
        <button class="gallery-arrow gallery-prev" aria-label="Previous image">&#8592;</button>
        <div class="gallery-viewer">
          <img id="galleryImg" src="" alt="" />
          <div class="gallery-caption">
            <span id="galleryMaterial" class="gallery-material-label"></span>
            <span id="galleryTitle" class="gallery-img-title"></span>
            <span id="galleryCounter" class="gallery-counter"></span>
          </div>
        </div>
        <button class="gallery-arrow gallery-next" aria-label="Next image">&#8594;</button>
      </div>
      <div id="galleryDots" class="gallery-dots"></div>
    </div>

    <div class="back">
      <a class="btn secondary back-transition" href="index.html#projects">← Back to portfolio</a>
    </div>

    <div id="backTransition" class="back-transition-layer">
      <div class="wipe-rocket">
        <div class="rocket-body"></div>
        <div class="rocket-window"></div>
        <div class="rocket-fin left"></div>
        <div class="rocket-fin right"></div>
        <div class="rocket-flame"></div>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
